# the file name has to be exactly pyproject.toml or pytest.ini
# pyproject.toml is shared by many other tools, while pytest.ini is explicitly for pytest only

[tool.pytest.ini_options]
asyncio_mode = "auto" # auto lets async def test_* fns run as async tests without need to decorate each test fn with @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"] # the "tests" dirname here is considered relative to this toml file's path, testpaths is optional but narrows down the search of dir for pytest
addopts = "--disable-warnings" # set of flags we want to use when running pytest

[project]
name = "koshledger"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pydantic[email]==2.14.1",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "httpx==0.28.1",
    "gunicorn>=27.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]

[tool.uv]
package = false # makes sure the project itself is not installed into .venv as a python package
