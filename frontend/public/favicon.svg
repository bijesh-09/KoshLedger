<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KoshLedger">
  <title>KoshLedger</title>
  <rect width="64" height="64" rx="10.5" fill="#272aaf"/>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- card flap across the top -->
    <path d="M15 22.4v-4a1.8 1.8 0 0 1 1.8-1.8h25.1a1.8 1.8 0 0 1 1.8 1.8v4"/>
    <!-- wallet body: square top-left because the flap sits on it -->
    <path d="M15 22.4h30.7a1.3 1.3 0 0 1 1.3 1.3v22.2a1.3 1.3 0 0 1-1.3 1.3H16.3a1.3 1.3 0 0 1-1.3-1.3z"/>
    <!-- clasp; filled with the card colour so it cuts the body edge behind it -->
    <rect x="37.5" y="30.8" width="11.6" height="8.4" rx="1.7" fill="#272aaf"/>
  </g>
  <circle cx="42.6" cy="34.9" r="0.85" fill="#fff"/>
</svg>
